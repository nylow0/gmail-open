<!doctype html>
<!--
  Opens one Gmail message from a digest link: the Gmail app on Android, Gmail web elsewhere.
  Link format: https://nylow0.github.io/gmail-open/#a=<account email>&m=<X-GM-MSGID in hex>
  Security model (tested in src/open-page.test.ts):
  - Data rides in the #fragment, which browsers never send to the server.
  - Only ever navigates to mail.google.com (or the Gmail app); strict input checks, so it is not an open redirect.
  - Wipes the fragment from the address bar/history, sends no referrer, loads nothing external.
  Published copy: github.com/nylow0/gmail-open. After editing, update the CSP hashes (the test tells you) and republish.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-VWa2j+nWgKKvATpoziYkbVPUwuDIbIJooHWkn7lnByg='; style-src 'sha256-9G3VrPgUGmfgH5p1HRTBVd3aK59uA5k8Sp12KUB7D5M='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Open in Gmail</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#ddd;font:16px system-ui,sans-serif;text-align:center}a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:12px;background:#c5221f;color:#fff;text-decoration:none;font-weight:600}[hidden]{display:none}</style>
</head>
<body>
<main>
<p id="status">Opening Gmail…</p>
<a id="open" hidden>Open Gmail</a>
</main>
<script>(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  // Remove the email address from the address bar and history before going anywhere.
  history.replaceState(null, "", location.pathname);

  const account = params.get("a") ?? "";
  const id = params.get("m") ?? "";
  const valid =
    [...params.keys()].length === 2 &&
    /^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9-]{1,63}(\.[A-Za-z0-9-]{1,63}){0,4}\.[A-Za-z]{2,24}$/.test(account) &&
    /^[0-9a-f]{1,16}$/.test(id);
  if (!valid) {
    document.getElementById("status").textContent = "This link is not valid.";
    return;
  }

  const web = "https://mail.google.com/mail/?authuser=" + encodeURIComponent(account) + "#all/" + id;
  // Android: an explicit intent for the Gmail package, so link-handling settings don't matter.
  // If Gmail is missing or refuses it, Chrome falls back to Gmail web.
  const target = /Android/i.test(navigator.userAgent)
    ? "intent://mail.google.com/mail/?authuser=" + encodeURIComponent(account) + "#all/" + id +
      "#Intent;scheme=https;package=com.google.android.gm;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
    : web;

  // Manual button in case the browser blocks the automatic jump.
  const button = document.getElementById("open");
  button.href = target;
  button.hidden = false;
  location.replace(target);
})();</script>
</body>
</html>
