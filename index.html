<!doctype html>
<!--
  Opens one Gmail message from a digest link: launches the Gmail app on Android (inbox; the app refuses
  every mail.google.com link, tested on a Samsung phone), the exact email on Gmail web elsewhere.
  Link format: https://nylow0.github.io/gmail-open/#a=<account email>&m=<X-GM-MSGID in hex>
  Security model (tested in src/open-page.test.ts):
  - Data rides in the #fragment, which browsers never send to the server.
  - Only ever navigates to mail.google.com (or the Gmail app); strict input checks, so it is not an open redirect.
  - Wipes the fragment from the address bar/history, sends no referrer, loads nothing external.
  Published copy: github.com/nylow0/gmail-open. After editing, update the CSP hashes (the test tells you) and republish.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-b22a+KgiK2Y5vqQAW7QNSrgav/jolbHQjm4fR+EVElg='; style-src 'sha256-GaWky7LMzxPqvAXimBEcMhi497IDYkdaWdu4CEhieA0='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Open in Gmail</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#ddd;font:16px system-ui,sans-serif;text-align:center}a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:12px;background:#c5221f;color:#fff;text-decoration:none;font-weight:600}.quiet{background:none;color:#999;font-weight:400;text-decoration:underline}[hidden]{display:none}</style>
</head>
<body>
<main>
<p id="status">Opening Gmail…</p>
<a id="open" hidden>Open Gmail</a>
<p><a id="web" class="quiet" hidden>Open in browser instead</a></p>
</main>
<script>(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  // Remove the email address from the address bar and history before going anywhere.
  history.replaceState(null, "", location.pathname);

  const account = params.get("a") ?? "";
  const id = params.get("m") ?? "";
  const valid =
    [...params.keys()].length === 2 &&
    /^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9-]{1,63}(\.[A-Za-z0-9-]{1,63}){0,4}\.[A-Za-z]{2,24}$/.test(account) &&
    /^[0-9a-f]{1,16}$/.test(id);
  if (!valid) {
    document.getElementById("status").textContent = "This link is not valid.";
    return;
  }

  const web = "https://mail.google.com/mail/?authuser=" + encodeURIComponent(account) + "#all/" + id;
  // Android: launch the Gmail app itself, like tapping its icon. The app refuses every
  // mail.google.com intent, and a browser_fallback_url would silently land in Gmail web instead.
  const android = /Android/i.test(navigator.userAgent);
  const target = android
    ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.google.android.gm;end"
    : web;

  // If Chrome blocks the automatic launch, these stay on screen: a tap always works.
  const button = document.getElementById("open");
  button.href = target;
  button.hidden = false;
  if (android) {
    const browser = document.getElementById("web");
    browser.href = web;
    browser.hidden = false;
  }
  location.replace(target);
})();</script>
</body>
</html>
